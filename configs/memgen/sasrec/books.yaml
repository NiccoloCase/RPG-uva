# MemGen-GR SASRec on Amazon Books (367,982 items).
# The model scores every item at every position, so the logits of one batch are
# batch x 50 x 367,982 floats: 18.8 GB at the default batch size of 256.
# Batch sizes are reduced to fit a 40 GB GPU. The default learning rate (3e-3)
# stops improving after a few epochs on this catalogue, so it is lowered to
# 3e-4; validation runs every epoch with a patience of 5 epochs, since one
# epoch takes about an hour. Everything else is the default.
category: Books
train_batch_size: 64
eval_batch_size: 32
lr: 0.0003
eval_interval: 1
patience: 5
