run_id: rpg_graph_analysis_beauty

# Shared checkpoint/tokenizer reconstruction for the Beauty dataset.
category: Beauty
metadata: sentence
n_codebook: 32

# Graph cache for the decoding analyses: one exact top-graph_topk graph per
# checkpoint, sliced to the decoding widths n_edges used by each command.
graph_backend: exact_gpu
graph_topk: 200
graph_analysis_output_dir: artifacts/rpg/graph_analysis/beauty
graph_analysis_random_seeds: [2024, 2025, 2026]

# Decoding settings used by the analysis commands (released README values);
# each command's own config enables them.
# temperature: 0.03
# num_beams: 20
# n_edges: 200
# propagation_steps: 3
