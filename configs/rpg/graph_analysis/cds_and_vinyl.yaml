run_id: rpg_graph_analysis_cds_and_vinyl

# Shared checkpoint/tokenizer reconstruction for the CDs stress test.
category: CDs_and_Vinyl
metadata: sentence
n_codebook: 64

# Graph cache for the decoding analyses: one exact top-graph_topk graph per
# checkpoint, sliced to the decoding widths n_edges used by each command.
graph_backend: flat
graph_topk: 500
graph_vector_batch_size: 512
graph_analysis_output_dir: artifacts/rpg/graph_analysis/cds_and_vinyl
graph_analysis_random_seeds: [2024, 2025, 2026]

# Decoding settings used by the analysis commands (released README values);
# each command's own config enables them.
# temperature: 0.03
# num_beams: 20
# n_edges: 500
# propagation_steps: 5
