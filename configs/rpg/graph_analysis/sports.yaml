run_id: rpg_graph_analysis_sports

# Shared checkpoint/tokenizer reconstruction.
# These must match the checkpoint and semantic-ID cache used for Sports.
category: Sports_and_Outdoors
metadata: sentence
n_codebook: 16

# Graph cache for the decoding analyses: one exact top-graph_topk graph per
# checkpoint, sliced to the decoding widths n_edges used by each command.
graph_backend: flat
graph_topk: 100
graph_vector_batch_size: 512
graph_analysis_output_dir: artifacts/rpg/graph_analysis/sports
graph_analysis_random_seeds: [2024, 2025, 2026]

# Decoding settings used by the analysis commands (released README values);
# each command's own config enables them.
# temperature: 0.03
# num_beams: 100
# n_edges: 30
# propagation_steps: 5
