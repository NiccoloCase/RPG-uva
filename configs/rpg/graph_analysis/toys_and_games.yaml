run_id: rpg_graph_analysis_toys_and_games

# Shared checkpoint/tokenizer reconstruction for the Toys and Games dataset.
category: Toys_and_Games
metadata: sentence
n_codebook: 16

# Graph cache for the decoding analyses: one exact top-graph_topk graph per
# checkpoint, sliced to the decoding widths n_edges used by each command.
graph_backend: flat
graph_topk: 100
graph_vector_batch_size: 512
graph_analysis_output_dir: artifacts/rpg/graph_analysis/toys_and_games
graph_analysis_random_seeds: [2024, 2025, 2026]

# Decoding settings used by the analysis commands (released README values);
# each command's own config enables them.
# temperature: 0.03
# num_beams: 200
# n_edges: 20
# propagation_steps: 3
