# SASRec architecture defaults from CIKM2020-S3Rec.
hidden_size: 64
num_hidden_layers: 2
num_attention_heads: 2
hidden_act: gelu
attention_probs_dropout_prob: 0.5
hidden_dropout_prob: 0.5
initializer_range: 0.02
max_seq_length: 50

# Training defaults.
lr: 0.001
train_batch_size: 256
eval_batch_size: 256
epochs: 200
weight_decay: 0.0
adam_beta1: 0.9
adam_beta2: 0.999
seed: 42
log_freq: 1
patience: 10
topk: [5, 10, 20]
val_metric: ndcg@20
full_sort: true
no_cuda: false

# Preprocessing defaults shared by SASRec reproduction jobs.
rating_score: 0.0
user_core: 5
item_core: 5

# Repo-owned options.
loss_type: bce        # bce: one sampled negative per position (S3-Rec / original SASRec); ce: softmax over all items;
                      # sampled_ce: softmax over the target plus n_negatives uniform items (for large catalogues)
n_negatives: 4096     # negatives per batch for sampled_ce
val_max_users: ~      # validate on a fixed random subset of this many users; None = all users
mask_history: true     # remove the user's past items from the ranking at evaluation (S3-Rec protocol); RPG does not
